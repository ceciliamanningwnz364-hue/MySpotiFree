name: Build Volna 1.1 IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Restore Volna 1.1 sources
        env:
          VOLNA_SOURCE: 
          VOLNA_SHA256: 689ca88f3a62d0d93149a6483ccaee6b3eef607773f80fee72ba0201195d1b2e
        run: |
          python3 - <<'PYTHON'
          import os, io, base64, zipfile, hashlib
          data = base64.b64decode(os.environ['VOLNA_SOURCE'], validate=True)
          assert hashlib.sha256(data).hexdigest() == os.environ['VOLNA_SHA256'], 'Source archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              archive.extractall('source')
          PYTHON
          sips -s format png source/Volna/Assets.xcassets/AppIcon.appiconset/AppIcon.jpg --out source/Volna/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          rm source/Volna/Assets.xcassets/AppIcon.appiconset/AppIcon.jpg
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate
      - name: Build for iPhone
        working-directory: source
        run: >-
          xcodebuild -project Volna.xcodeproj -scheme Volna
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R source/build/Build/Products/Release-iphoneos/Volna.app output/Payload/
          cd output
          zip -r Volna-1.1-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Volna-1.1-unsigned-needs-signing
          path: output/Volna-1.1-unsigned.ipa
          if-no-files-found: error
      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: Volna-1.1-source
          path: |
            source/Volna
            source/project.yml
            source/README.md
